<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo Elo-MARCA · Mundial 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #fff;
      color: #111;
      -webkit-text-size-adjust: 100%;
    }

    .wrap { padding: 16px 12px 20px; }

    h1 {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 3px;
      color: #111;
    }

    .sub {
      font-size: 12px;
      color: #777;
      margin-bottom: 14px;
    }

    .scroll-hint {
      font-size: 11px;
      color: #bbb;
      text-align: right;
      margin-bottom: 5px;
      display: none;
    }

    .tbl-outer {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }

    table {
      border-collapse: collapse;
      min-width: 500px;
      width: 100%;
    }

    /* ── HEADER ── */
    thead th {
      background: #f5f5f5;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #666;
      padding: 9px 8px;
      text-align: center;
      white-space: nowrap;
      border-bottom: 2px solid #ddd;
    }

    thead th.h-team {
      text-align: left;
      padding-left: 10px;
      position: sticky;
      left: 0;
      z-index: 3;
      border-right: 1px solid #ddd;
    }

    /* ── ROWS ── */
    tbody tr:nth-child(even) td.c-team { background: #fafafa; }
    tbody tr:nth-child(odd)  td.c-team { background: #fff; }

    /* ── TEAM CELL ── */
    td.c-team {
      position: sticky;
      left: 0;
      z-index: 1;
      border-right: 1px solid #e2e2e2;
      border-bottom: 1px solid #ededed;
      white-space: nowrap;
      padding: 0;
    }

    .t-inner {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px 6px 8px;
    }

    .t-pos {
      font-size: 10px;
      color: #c0c0c0;
      font-weight: 500;
      min-width: 15px;
      text-align: right;
    }

    .t-flag { font-size: 15px; line-height: 1; }

    .t-name {
      font-size: 12.5px;
      font-weight: 600;
      color: #111;
    }

    /* ── VALUE CELLS ── */
    td.c-val {
      padding: 7px 8px;
      text-align: center;
      vertical-align: middle;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
      min-width: 60px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    /* ── FOOTER ── */
    .foot {
      margin-top: 10px;
      font-size: 10.5px;
      color: #bbb;
      line-height: 1.8;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 520px) {
      h1 { font-size: 15px; }
      .scroll-hint { display: block; }
      td.c-val { min-width: 54px; font-size: 11px; padding: 6px 5px; }
      .t-name { font-size: 12px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>España, clara favorita para ganar el Mundial</h1>
  <p class="sub">Predicciones basadas en el Modelo Elo-MARCA</p>
  <p class="scroll-hint">← desliza para ver más →</p>
  <div class="tbl-outer">
    <table>
      <thead>
        <tr>
          <th class="h-team">Selección</th>
          <th>Grupos</th>
          <th>R32</th>
          <th>Octavos</th>
          <th>Cuartos</th>
          <th>Semis</th>
          <th>Campeón</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="foot">
    <div>Ranking Elo · 100.000 simulaciones</div>
    <div>Tabla: Miguel Ángel García (@miguelangaro) · Fuente: eloratings</div>
  </div>
</div>

<script>
// ── Banderas ──────────────────────────────────────────────────────────────────
const F = {
  'España':'🇪🇸','Argentina':'🇦🇷','Francia':'🇫🇷','Brasil':'🇧🇷',
  'Inglaterra':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','Portugal':'🇵🇹','Colombia':'🇨🇴','Ecuador':'🇪🇨',
  'Alemania':'🇩🇪','Países Bajos':'🇳🇱','Turquía':'🇹🇷','Suiza':'🇨🇭',
  'Noruega':'🇳🇴','Croacia':'🇭🇷','México':'🇲🇽','Bélgica':'🇧🇪',
  'Japón':'🇯🇵','Uruguay':'🇺🇾','Senegal':'🇸🇳','Marruecos':'🇲🇦',
  'Paraguay':'🇵🇾','Canadá':'🇨🇦','Escocia':'🏴󠁧󠁢󠁳󠁣󠁴󠁿','Austria':'🇦🇹',
  'Australia':'🇦🇺','Suecia':'🇸🇪','Argelia':'🇩🇿','Panamá':'🇵🇦',
  'Rep. Checa':'🇨🇿','EE.UU.':'🇺🇸','Corea del Sur':'🇰🇷','Uzbekistán':'🇺🇿',
  'Irán':'🇮🇷','Costa de Marfil':'🇨🇮','Bosnia-Herz.':'🇧🇦','Qatar':'🇶🇦',
  'Haití':'🇭🇹','Sudáfrica':'🇿🇦','Curazao':'🇨🇼','Túnez':'🇹🇳',
  'Cabo Verde':'🇨🇻','Arabia Saudí':'🇸🇦','Egipto':'🇪🇬','Nueva Zelanda':'🇳🇿',
  'Jordania':'🇯🇴','Irak':'🇮🇶','RD Congo':'🇨🇩','Ghana':'🇬🇭'
};

// ── Escala de color heatmap (valor 0-100 → r,g,b) ────────────────────────────
// Blanco → amarillo → naranja → coral → rosa → magenta → morado oscuro
const STOPS = [
  [0,   255,255,255],
  [4,   255,251,210],
  [10,  255,234, 90],
  [18,  255,193, 48],
  [28,  255,143, 43],
  [40,  248, 82, 72],
  [55,  222, 36, 98],
  [70,  182, 12, 88],
  [85,  128,  4, 73],
  [100,  52,  0, 46]
];

function heat(v) {
  if (v <= 0) return ['#fff', '#bbb'];
  v = Math.min(v, 100);
  let lo = STOPS[0], hi = STOPS[STOPS.length - 1];
  for (let i = 0; i < STOPS.length - 1; i++) {
    if (v >= STOPS[i][0] && v <= STOPS[i+1][0]) { lo = STOPS[i]; hi = STOPS[i+1]; break; }
  }
  const t = (v - lo[0]) / (hi[0] - lo[0]);
  const r = Math.round(lo[1] + t * (hi[1] - lo[1]));
  const g = Math.round(lo[2] + t * (hi[2] - lo[2]));
  const b = Math.round(lo[3] + t * (hi[3] - lo[3]));
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return [`rgb(${r},${g},${b})`, lum < 0.52 ? '#fff' : '#111'];
}

// ── Parse CSV ─────────────────────────────────────────────────────────────────
function parseCSV(txt) {
  const lines = txt.trim().split(/\r?\n/);
  const hdr = lines[0].split(',').map(s => s.trim());
  return lines.slice(1).map(line => {
    const cols = line.split(',').map(s => s.trim());
    const o = {};
    hdr.forEach((h, i) => o[h] = cols[i] ?? '');
    return o;
  });
}

function fmt(v) {
  if (v <= 0) return '—';
  return v.toFixed(1) + '%';
}

// ── Render ────────────────────────────────────────────────────────────────────
const COLS = ['Grupos%','1/32%','1/16%','Cuartos%','Semis%','Campeón%'];

async function init() {
  const tbody = document.getElementById('tbody');
  let rows;
  try {
    const res = await fetch('./data.csv');
    const txt = await res.text();
    rows = parseCSV(txt);
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="7" style="padding:20px;text-align:center;color:#aaa">No se pudieron cargar los datos.</td></tr>';
    return;
  }

  // Ordenar por Campeón% desc (por si el CSV no viene ordenado)
  rows.sort((a, b) => parseFloat(b['Campeón%'] || 0) - parseFloat(a['Campeón%'] || 0));

  rows.forEach((row, i) => {
    const name = row['Selección'] || '';
    const flag = F[name] || '🏳';
    const tr = document.createElement('tr');

    // Celda equipo (sticky)
    const tdT = document.createElement('td');
    tdT.className = 'c-team';
    tdT.innerHTML = `<div class="t-inner">
      <span class="t-pos">${i + 1}</span>
      <span class="t-flag">${flag}</span>
      <span class="t-name">${name}</span>
    </div>`;
    tr.appendChild(tdT);

    // Celdas de porcentaje
    COLS.forEach(k => {
      const v = parseFloat(row[k]) || 0;
      const [bg, col] = heat(v);
      const td = document.createElement('td');
      td.className = 'c-val';
      td.style.background = bg;
      td.style.color = col;
      td.textContent = fmt(v);
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
}

init();
</script>
</body>
</html>
