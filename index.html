<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo Elo-MARCA · Mundial 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #fff;
      color: #111;
      -webkit-text-size-adjust: 100%;
    }

    .wrap { padding: 16px 12px 20px; }

    h1 {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 3px;
      color: #111;
    }

    .sub {
      font-size: 12px;
      color: #777;
      margin-bottom: 14px;
    }

    .scroll-hint {
      font-size: 11px;
      color: #bbb;
      text-align: right;
      margin-bottom: 5px;
      display: none;
    }

    .tbl-outer {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }

    table {
      border-collapse: collapse;
      min-width: 500px;
      width: 100%;
    }

    /* ── HEADER ── */
    thead th {
      background: #f5f5f5;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #666;
      padding: 9px 8px;
      text-align: center;
      white-space: nowrap;
      border-bottom: 2px solid #ddd;
      cursor: pointer;
      user-select: none;
    }

    thead th:hover { background: #ebebeb; }

    thead th.sorted { color: #111; background: #e8e8e8; }

    .sort-icon { margin-left: 3px; opacity: 0.35; font-style: normal; }
    thead th.sorted .sort-icon { opacity: 1; }

    thead th.h-team {
      text-align: left;
      padding-left: 10px;
      position: sticky;
      left: 0;
      z-index: 3;
      border-right: 1px solid #ddd;
    }

    /* ── ROWS ── */
    tbody tr:nth-child(even) td.c-team { background: #fafafa; }
    tbody tr:nth-child(odd)  td.c-team { background: #fff; }

    /* ── TEAM CELL ── */
    td.c-team {
      position: sticky;
      left: 0;
      z-index: 1;
      border-right: 1px solid #e2e2e2;
      border-bottom: 1px solid #ededed;
      white-space: nowrap;
      padding: 0;
    }

    .t-inner {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px 6px 8px;
    }

    .t-pos {
      font-size: 10px;
      color: #c0c0c0;
      font-weight: 500;
      min-width: 15px;
      text-align: right;
    }

    .t-flag { display: inline-flex; align-items: center; }
    .t-flag img { width: 20px; height: 15px; object-fit: cover; border-radius: 2px; display: block; }

    .t-name {
      font-size: 12.5px;
      font-weight: 600;
      color: #111;
    }

    /* ── VALUE CELLS ── */
    td.c-val {
      padding: 7px 8px;
      text-align: center;
      vertical-align: middle;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
      min-width: 60px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    /* ── FOOTER ── */
    .foot {
      margin-top: 10px;
      font-size: 10.5px;
      color: #bbb;
      line-height: 1.8;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 520px) {
      h1 { font-size: 15px; }
      .scroll-hint { display: block; }
      td.c-val { min-width: 54px; font-size: 11px; padding: 6px 5px; }
      .t-name { font-size: 12px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>El pronosticador del Mundial 2026</h1>
  <p class="sub">Probabilidades de pasar cada ronda. Predicciones basadas en el Modelo Elo-MARCA</p>
  <p class="scroll-hint">← desliza para ver más →</p>
  <div class="tbl-outer">
    <table>
      <thead>
        <tr>
          <th class="h-team" data-col="Selección">Selección<i class="sort-icon">↕</i></th>
          <th data-col="Grupos%">Grupos<i class="sort-icon">↕</i></th>
          <th data-col="1/32%">R32<i class="sort-icon">↕</i></th>
          <th data-col="1/16%">Octavos<i class="sort-icon">↕</i></th>
          <th data-col="Cuartos%">Cuartos<i class="sort-icon">↕</i></th>
          <th data-col="Semis%">Semis<i class="sort-icon">↕</i></th>
          <th data-col="Campeón%">Campeón<i class="sort-icon">↕</i></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="foot">
    <div>Ranking Elo · 100.000 simulaciones</div>
    <div>Tabla: Miguel Ángel García (@miguelangaro) · Fuente: eloratings</div>
  </div>
</div>

<script>
// ── Banderas (códigos ISO 3166-1 alpha-2 para flagcdn.com) ───────────────────
const F = {
  'España':'es','Argentina':'ar','Francia':'fr','Brasil':'br',
  'Inglaterra':'gb-eng','Portugal':'pt','Colombia':'co','Ecuador':'ec',
  'Alemania':'de','Países Bajos':'nl','Turquía':'tr','Suiza':'ch',
  'Noruega':'no','Croacia':'hr','México':'mx','Bélgica':'be',
  'Japón':'jp','Uruguay':'uy','Senegal':'sn','Marruecos':'ma',
  'Paraguay':'py','Canadá':'ca','Escocia':'gb-sct','Austria':'at',
  'Australia':'au','Suecia':'se','Argelia':'dz','Panamá':'pa',
  'Rep. Checa':'cz','EE.UU.':'us','Corea del Sur':'kr','Uzbekistán':'uz',
  'Irán':'ir','Costa de Marfil':'ci','Bosnia-Herz.':'ba','Qatar':'qa',
  'Haití':'ht','Sudáfrica':'za','Curazao':'cw','Túnez':'tn',
  'Cabo Verde':'cv','Arabia Saudí':'sa','Egipto':'eg','Nueva Zelanda':'nz',
  'Jordania':'jo','Irak':'iq','RD Congo':'cd','Ghana':'gh'
};

// ── Escala de color heatmap (valor 0-100 → r,g,b) ────────────────────────────
// Blanco → amarillo → naranja → coral → rosa → magenta → morado oscuro
const STOPS = [
  [0,   255,255,255],
  [4,   255,251,210],
  [10,  255,234, 90],
  [18,  255,193, 48],
  [28,  255,143, 43],
  [40,  248, 82, 72],
  [55,  222, 36, 98],
  [70,  182, 12, 88],
  [85,  128,  4, 73],
  [100,  52,  0, 46]
];

function heat(v) {
  if (v <= 0) return ['#fff', '#bbb'];
  v = Math.min(v, 100);
  let lo = STOPS[0], hi = STOPS[STOPS.length - 1];
  for (let i = 0; i < STOPS.length - 1; i++) {
    if (v >= STOPS[i][0] && v <= STOPS[i+1][0]) { lo = STOPS[i]; hi = STOPS[i+1]; break; }
  }
  const t = (v - lo[0]) / (hi[0] - lo[0]);
  const r = Math.round(lo[1] + t * (hi[1] - lo[1]));
  const g = Math.round(lo[2] + t * (hi[2] - lo[2]));
  const b = Math.round(lo[3] + t * (hi[3] - lo[3]));
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return [`rgb(${r},${g},${b})`, lum < 0.52 ? '#fff' : '#111'];
}

// ── Parse CSV ─────────────────────────────────────────────────────────────────
function parseCSV(txt) {
  const lines = txt.trim().split(/\r?\n/);
  const hdr = lines[0].split(',').map(s => s.trim());
  return lines.slice(1).map(line => {
    const cols = line.split(',').map(s => s.trim());
    const o = {};
    hdr.forEach((h, i) => o[h] = cols[i] ?? '');
    return o;
  });
}

function fmt(v) {
  if (v <= 0) return '—';
  return v.toFixed(1) + '%';
}

// ── Render ────────────────────────────────────────────────────────────────────
const COLS = ['Grupos%','1/32%','1/16%','Cuartos%','Semis%','Campeón%'];

let allRows = [];
let sortCol = 'Campeón%';
let sortDir = -1; // -1 = desc, 1 = asc

function render() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  const sorted = [...allRows].sort((a, b) => {
    if (sortCol === 'Selección') {
      return sortDir * a['Selección'].localeCompare(b['Selección'], 'es');
    }
    return sortDir * (parseFloat(b[sortCol] || 0) - parseFloat(a[sortCol] || 0));
  });

  // Actualizar cabeceras
  document.querySelectorAll('thead th').forEach(th => {
    const col = th.dataset.col;
    const icon = th.querySelector('.sort-icon');
    th.classList.toggle('sorted', col === sortCol);
    icon.textContent = col !== sortCol ? '↕' : (sortDir === -1 ? '↓' : '↑');
  });

  sorted.forEach((row, i) => {
    const name = row['Selección'] || '';
    const code = F[name];
    const flagImg = code
      ? `<img src="https://flagcdn.com/20x15/${code}.png" alt="${name}" loading="lazy">`
      : '';
    const tr = document.createElement('tr');

    const tdT = document.createElement('td');
    tdT.className = 'c-team';
    tdT.innerHTML = `<div class="t-inner">
      <span class="t-pos">${i + 1}</span>
      <span class="t-flag">${flagImg}</span>
      <span class="t-name">${name}</span>
    </div>`;
    tr.appendChild(tdT);

    COLS.forEach(k => {
      const v = parseFloat(row[k]) || 0;
      const [bg, col] = heat(v);
      const td = document.createElement('td');
      td.className = 'c-val';
      td.style.background = bg;
      td.style.color = col;
      td.textContent = fmt(v);
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
}

async function init() {
  const tbody = document.getElementById('tbody');
  try {
    const res = await fetch('./data.csv');
    const txt = await res.text();
    allRows = parseCSV(txt);
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="7" style="padding:20px;text-align:center;color:#aaa">No se pudieron cargar los datos.</td></tr>';
    return;
  }

  // Click en cabecera → ordenar
  document.querySelectorAll('thead th').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) {
        sortDir *= -1;
      } else {
        sortCol = col;
        sortDir = col === 'Selección' ? 1 : -1;
      }
      render();
    });
  });

  render();
}

init();
</script>
</body>
</html>
