name: Actualizar Mundial ELO

on:
  schedule:
    - cron: '30 7 * * *'   # 09:30 hora Madrid (UTC+2 en verano)
  workflow_dispatch:         # lanzamiento manual desde GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements_ci.txt
          playwright install chromium --with-deps

      - name: Ejecutar pipeline
        run: python actualizar_ci.py

      - name: Commit y push de data.csv y caché
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.csv .cache/
          git diff --staged --quiet || git commit -m "Auto: actualización $(date +'%Y-%m-%d %H:%M UTC')"
          git push
