name: Actualizar Mundial ELO

on:
  schedule:
    - cron: '30 7 * * *'   # 09:30 hora Madrid (UTC+2 en verano)
  workflow_dispatch:         # lanzamiento manual desde GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 5   # suficiente para git log de data.csv

      - name: Comprobar si data.csv ya fue actualizado hoy
        id: check
        run: |
          LAST=$(git log -1 --format="%cd" --date=format-local:"%Y-%m-%d" -- data.csv 2>/dev/null || echo "")
          TODAY=$(TZ="Europe/Madrid" date +%Y-%m-%d)
          echo "Último commit de data.csv: '$LAST' | Hoy Madrid: '$TODAY'"
          if [ "$LAST" = "$TODAY" ]; then
            echo "ya_actualizado=true" >> $GITHUB_OUTPUT
            echo "✓ data.csv ya actualizado hoy — saltando pipeline."
          else
            echo "ya_actualizado=false" >> $GITHUB_OUTPUT
            echo "→ data.csv desactualizado — ejecutando pipeline."
          fi

      - name: Configurar Python
        if: steps.check.outputs.ya_actualizado == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Caché de pip
        if: steps.check.outputs.ya_actualizado == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements_ci.txt') }}
          restore-keys: pip-

      - name: Instalar dependencias Python
        if: steps.check.outputs.ya_actualizado == 'false'
        run: pip install -r requirements_ci.txt

      - name: Caché de Playwright (Chromium)
        if: steps.check.outputs.ya_actualizado == 'false'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements_ci.txt') }}

      - name: Instalar Chromium
        if: steps.check.outputs.ya_actualizado == 'false' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Instalar dependencias de sistema para Chromium (si usamos caché)
        if: steps.check.outputs.ya_actualizado == 'false' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Ejecutar pipeline
        if: steps.check.outputs.ya_actualizado == 'false'
        run: python actualizar_ci.py

      - name: Commit y push de data.csv y caché
        if: steps.check.outputs.ya_actualizado == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.csv .cache/
          git diff --staged --quiet && echo "Sin cambios en data.csv — nada que commitear." && exit 0
          git commit -m "Auto: actualización $(date +'%Y-%m-%d %H:%M UTC')"
          # Primer intento de push
          if ! git push; then
            echo "Push rechazado (posible push concurrente del portátil). Reintentando…"
            # Pull con preferencia a lo remoto en caso de conflicto en data.csv.
            # Si el portátil ya actualizó data.csv, lo respetamos y descartamos el cambio de GA.
            git pull --rebase -X ours origin main
            git push
          fi
